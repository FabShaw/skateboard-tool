<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skate Motion Capture</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #121212;
        color: #fff;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      h1 {
        color: #00ff88;
        font-size: 1.5rem;
        margin-bottom: 10px;
      }
      .container {
        width: 100%;
        max-width: 500px;
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      video {
        width: 100%;
        border-radius: 8px;
        background: #222;
      }
      .controls {
        display: flex;
        gap: 10px;
      }
      button {
        flex: 1;
        padding: 12px;
        border: 0;
        border-radius: 6px;
        font-weight: bold;
        font-size: 1rem;
        cursor: pointer;
      }
      .btn-start {
        background: #00ff88;
        color: #121212;
      }
      .btn-stop {
        background: #ff3333;
        color: #fff;
      }
      .btn-preview {
        background: #0088ff;
        color: #fff;
      }
      .btn-preview-active {
        background: #00ff88;
        color: #121212;
      }
      .camera-mode-control {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .camera-mode-control label {
        color: #00ff88;
        font-size: 0.9rem;
        font-weight: bold;
      }
      .status-box {
        padding: 15px;
        border-radius: 6px;
        background: #1e1e1e;
        text-align: center;
        font-size: 1.1rem;
        font-weight: bold;
        border: 1px solid #333;
      }
      .status-idle {
        color: #aaa;
      }
      .status-recording {
        color: #f33;
        animation: blink 1s infinite;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }
      .stats {
        font-size: 0.85rem;
        color: #888;
        display: flex;
        justify-content: space-between;
        padding: 0 5px;
      }
      .settings {
        background: #1e1e1e;
        padding: 15px;
        border-radius: 6px;
        border: 1px solid #333;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .setting-row {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .setting-label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.9rem;
        color: #00ff88;
        font-weight: bold;
      }
      .setting-value {
        color: #888;
        font-size: 0.85rem;
      }
      input[type='range'] {
        width: 100%;
      }
      select {
        width: 100%;
        padding: 8px;
        border-radius: 6px;
        background: #2a2a2a;
        color: #00ff88;
        border: 1px solid #444;
        font-weight: bold;
        font-size: 0.9rem;
      }
      canvas {
        display: none;
      }
      .preview-hidden {
        display: none;
      }
      .wake-lock-indicator {
        font-size: 0.75rem;
        color: #00ff88;
        margin-top: 8px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Skate Motion Capture</h1>
      <button class="btn-preview" id="previewToggleBtn">Live-Preview aktivieren</button>
      <video id="preview" autoplay playsinline muted class="preview-hidden"></video>
      <div class="camera-mode-control">
        <label for="cameraModeSelect">Kamera-Modus</label
        ><select id="cameraModeSelect" disabled>
          <option value="rear-normal">Rück-Normal-Kamera</option>
          <option value="rear-wide">Rück-Weitwinkel-Kamera</option>
          <option value="front">Front-Kamera</option>
        </select>
      </div>
      <canvas id="motionCanvas"></canvas>
      <div class="controls">
        <button class="btn-start" id="startBtn">Erkennung Starten</button
        ><button class="btn-stop" id="stopBtn" style="display: none">Stoppen</button>
      </div>
      <div class="status-box status-idle" id="statusText">Bereit. Bitte Erkennung starten.</div>
      <div class="stats">
        <span id="clipCount">Gespeicherte Clips: 0</span><span id="motionValue">Bewegung: 0%</span>
      </div>
      <div class="settings">
        <div class="setting-row">
          <div class="setting-label">
            <span>Empfindlichkeit (Sensitivity)</span
            ><span class="setting-value" id="sensitivityValue">50</span>
          </div>
          <input type="range" id="sensitivitySlider" min="0" max="255" value="50" />
        </div>
        <div class="setting-row">
          <div class="setting-label">
            <span>Bewegungsschwelle (Motion Threshold)</span
            ><span class="setting-value" id="thresholdValue">1.5%</span>
          </div>
          <input type="range" id="thresholdSlider" min="0.5" max="10" step="0.5" value="1.5" />
        </div>
        <div class="setting-row">
          <div class="setting-label">
            <span>Nachlaufzeit (Cooldown)</span
            ><span class="setting-value" id="cooldownValue">4s</span>
          </div>
          <input type="range" id="cooldownSlider" min="1" max="10" value="4" />
        </div>
      </div>
      <div class="wake-lock-indicator" id="wakeLockIndicator"></div>
      <details class="settings">
        <summary style="color: #00ff88; font-weight: bold; cursor: pointer;">
          Debug: Erkannte Kameras
        </summary>
        <div id="debugPanel" style="font-size: 0.8rem; color: #aaa; margin-top: 8px;">
          Noch keine Kamera-Berechtigung erteilt.
        </div>
      </details>
    </div>
    <script>
      const video = document.getElementById('preview'),
        canvas = document.getElementById('motionCanvas'),
        ctx = canvas.getContext('2d', { willReadFrequently: true }),
        startBtn = document.getElementById('startBtn'),
        stopBtn = document.getElementById('stopBtn'),
        statusText = document.getElementById('statusText'),
        clipCountText = document.getElementById('clipCount'),
        motionValueText = document.getElementById('motionValue'),
        previewToggleBtn = document.getElementById('previewToggleBtn'),
        cameraModeSelect = document.getElementById('cameraModeSelect'),
        wakeLockIndicator = document.getElementById('wakeLockIndicator'),
        sensitivitySlider = document.getElementById('sensitivitySlider'),
        thresholdSlider = document.getElementById('thresholdSlider'),
        cooldownSlider = document.getElementById('cooldownSlider'),
        sensitivityValue = document.getElementById('sensitivityValue'),
        thresholdValue = document.getElementById('thresholdValue'),
        cooldownValue = document.getElementById('cooldownValue');
      let SENSITIVITY = 50,
        MOTION_THRESHOLD = 0.015,
        COOLDOWN_TIME = 4000,
        VIDEO_FPS = 30,
        stream = null,
        mediaRecorder = null,
        recordedChunks = [],
        previousFrame = null,
        isRecording = false,
        isMotionDetectionActive = false,
        isPreviewActive = false,
        lastMotionTime = 0,
        checkMotionInterval = null,
        clipCounter = 0,
        wakeLock = null,
        cameraMode = 'rear-normal',
        currentFacing = null;
      const STORAGE_KEYS = {
        sensitivity: 'skateCapture_sensitivity',
        threshold: 'skateCapture_threshold',
        cooldown: 'skateCapture_cooldown',
      };
      function isWideCamera(d) {
        return /wide|ultra|0[.,]5x|weitwinkel/i.test(d.label || '');
      }
      function isFrontCamera(d) {
        return /front|user|selfie|face/i.test(d.label || '');
      }
      async function requestWakeLock() {
        if ('wakeLock' in navigator)
          try {
            wakeLock = await navigator.wakeLock.request('screen');
            updateWakeLockIndicator(true);
          } catch (e) {
            updateWakeLockIndicator(false);
          }
        else updateWakeLockIndicator(false);
      }
      async function releaseWakeLock() {
        if (wakeLock) {
          try {
            await wakeLock.release();
            wakeLock = null;
            updateWakeLockIndicator(false);
          } catch (e) {}
        }
      }
      function updateWakeLockIndicator(a) {
        wakeLockIndicator.textContent = a ? '🔒 Display bleibt an' : 'Wake Lock nicht verfügbar';
      }
      function loadSettings() {
        let s = localStorage.getItem(STORAGE_KEYS.sensitivity),
          t = localStorage.getItem(STORAGE_KEYS.threshold),
          c = localStorage.getItem(STORAGE_KEYS.cooldown);
        if (s !== null) {
          sensitivitySlider.value = s;
          SENSITIVITY = parseInt(s);
          sensitivityValue.textContent = SENSITIVITY;
        }
        if (t !== null) {
          thresholdSlider.value = t;
          MOTION_THRESHOLD = parseFloat(t) / 100;
          thresholdValue.textContent = t + '%';
        }
        if (c !== null) {
          cooldownSlider.value = c;
          COOLDOWN_TIME = parseInt(c) * 1000;
          cooldownValue.textContent = c + 's';
        }
      }
      function saveSettings() {
        localStorage.setItem(STORAGE_KEYS.sensitivity, sensitivitySlider.value);
        localStorage.setItem(STORAGE_KEYS.threshold, thresholdSlider.value);
        localStorage.setItem(STORAGE_KEYS.cooldown, cooldownSlider.value);
      }
      window.addEventListener('DOMContentLoaded', () => {
        loadSettings();
        requestWakeLock();
      });
      sensitivitySlider.addEventListener('input', (e) => {
        SENSITIVITY = +e.target.value;
        sensitivityValue.textContent = SENSITIVITY;
        saveSettings();
      });
      thresholdSlider.addEventListener('input', (e) => {
        MOTION_THRESHOLD = +e.target.value / 100;
        thresholdValue.textContent = e.target.value + '%';
        saveSettings();
      });
      cooldownSlider.addEventListener('input', (e) => {
        COOLDOWN_TIME = +e.target.value * 1000;
        cooldownValue.textContent = e.target.value + 's';
        saveSettings();
      });

      previewToggleBtn.addEventListener('click', () =>
        isPreviewActive ? deactivatePreview() : activatePreview(),
      );

      // NEU: sorgt dafür, dass enumerateDevices() echte Labels liefert,
      // bevor Kameras anhand ihres Labels (front/wide/normal) erkannt werden.
      // Ohne erteilte Berechtigung liefert der Browser leere Labels, wodurch
      // isWideCamera()/isFrontCamera() für JEDES Gerät false zurückgeben und
      // einfach die erste vom OS gemeldete Kamera gewählt wird (unzuverlässig).
      async function ensureDeviceLabels() {
        let devices = (await navigator.mediaDevices.enumerateDevices()).filter(
          (d) => d.kind === 'videoinput',
        );
        if (devices.some((d) => !d.label)) {
          try {
            const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
            tempStream.getTracks().forEach((t) => t.stop());
          } catch (e) {}
          devices = (await navigator.mediaDevices.enumerateDevices()).filter(
            (d) => d.kind === 'videoinput',
          );
        }
        return devices;
      }

      async function openCamera(mode) {
        let facing = mode === 'front' ? 'user' : 'environment',
          devices = [];
        try {
          devices = await ensureDeviceLabels();
        } catch (e) {}
        logDetectedCameras(devices);

        // Viele Phones (u.a. dieses hier) melden dem Browser nur EINE
        // logische Rückkamera und schalten intern zwischen Ultra-Weitwinkel/
        // Normal/Tele anhand des Zoom-Faktors um. Ein deviceId-Wechsel bringt
        // dann nichts, da es nur ein Gerät gibt. Deshalb wird nur bei einem
        // Wechsel der Blickrichtung (Front <-> Rück) ein neuer Stream über
        // getUserMedia geöffnet; Normal <-> Weitwinkel wird anschließend rein
        // über track.applyConstraints({ zoom }) auf demselben Stream geregelt.
        const needsNewStream = !stream || currentFacing !== facing;
        if (needsNewStream) {
          stopCameraStream();
          let vc = {
            facingMode: facing,
            width: { ideal: 1280 },
            height: { ideal: 720 },
            frameRate: { ideal: VIDEO_FPS },
          };
          stream = await navigator.mediaDevices.getUserMedia({ video: vc, audio: true });
          video.srcObject = stream;
          currentFacing = facing;
          video.onloadedmetadata = () => {
            canvas.width = 160;
            canvas.height = 120;
          };
        }
        cameraModeSelect.disabled = false;

        if (mode !== 'front') await applyZoomForMode(mode);
      }

      // Schaltet auf dem bestehenden Rückkamera-Track per Zoom-Constraint
      // zwischen Normal- und Weitwinkel-Ansicht um (statt deviceId, siehe
      // openCamera). Wenn der Browser/das Gerät keine Zoom-Capability
      // meldet, ist ein Linsenwechsel über die Web-API leider nicht möglich
      // und es bleibt bei der vom OS gewählten Standardlinse.
      async function applyZoomForMode(mode) {
        const track = stream && stream.getVideoTracks()[0];
        if (!track || typeof track.getCapabilities !== 'function') return;
        let caps = {};
        try {
          caps = track.getCapabilities();
        } catch (e) {}
        logZoomCapabilities(caps.zoom);
        if (!caps.zoom) {
          if (mode === 'rear-wide')
            statusText.textContent =
              'Dieses Gerät erlaubt keinen Linsenwechsel über den Browser (kein Zoom-Support gemeldet).';
          return;
        }
        const { min, max } = caps.zoom;
        const target = mode === 'rear-wide' ? min : Math.min(max, Math.max(min, 1));
        try {
          await track.applyConstraints({ advanced: [{ zoom: target }] });
          logZoomCapabilities(caps.zoom, target);
        } catch (e) {
          statusText.textContent = 'Zoom-Wechsel fehlgeschlagen: ' + e.message;
        }
      }

      function logZoomCapabilities(zoomCaps, current) {
        const panel = document.getElementById('debugPanel');
        if (!panel) return;
        const existing = panel.dataset.deviceLines || panel.innerHTML;
        panel.dataset.deviceLines = existing;
        const zoomLine = zoomCaps
          ? `Zoom-Bereich: ${zoomCaps.min} – ${zoomCaps.max}${
              current !== undefined ? ` (aktuell: ${current})` : ''
            }`
          : 'Keine Zoom-Capability gemeldet – Linsenwechsel über Browser nicht möglich.';
        panel.innerHTML = existing + '<br>' + zoomLine;
      }

      // Debug-Hilfsfunktion: zeigt die erkannten Kamera-Labels im
      // Debug-Panel an, damit man bei Problemen die tatsächlichen
      // Gerätebezeichnungen des Handys sehen kann.
      function logDetectedCameras(devices) {
        const panel = document.getElementById('debugPanel');
        if (!panel) return;
        if (!devices || !devices.length) {
          panel.textContent = 'Keine Video-Geräte erkannt.';
          return;
        }
        panel.innerHTML = devices
          .map((d, i) => {
            const label = d.label || '(kein Label – Berechtigung fehlt?)';
            const wide = isWideCamera(d) ? ' [wide erkannt]' : '';
            const front = isFrontCamera(d) ? ' [front erkannt]' : '';
            return `${i}: ${label}${wide}${front}`;
          })
          .join('<br>');
      }
      async function activatePreview() {
        try {
          if (!stream) await openCamera(cameraMode);
          isPreviewActive = true;
          video.classList.remove('preview-hidden');
          previewToggleBtn.textContent = 'Live-Preview deaktivieren';
          previewToggleBtn.classList.add('btn-preview-active');
          if (cameraMode !== 'rear-wide')
            statusText.textContent = 'Bereit. Bitte Erkennung starten.';
          statusText.className = 'status-box status-idle';
        } catch (e) {
          alert('Fehler beim Zugriff auf Kamera/Mikrofon: ' + e.message);
          statusText.textContent = 'Kamera konnte nicht gestartet werden.';
          statusText.className = 'status-box status-idle';
        }
      }
      function stopCameraStream() {
        if (stream) stream.getTracks().forEach((t) => t.stop());
        stream = null;
        video.srcObject = null;
        currentFacing = null;
      }
      function deactivatePreview() {
        if (isMotionDetectionActive) stopAll();
        isPreviewActive = false;
        video.classList.add('preview-hidden');
        previewToggleBtn.textContent = 'Live-Preview aktivieren';
        previewToggleBtn.classList.remove('btn-preview-active');
        statusText.textContent = 'Bereit. Bitte Erkennung starten.';
        statusText.className = 'status-box status-idle';
      }
      cameraModeSelect.addEventListener('change', async (e) => {
        let old = cameraMode;
        cameraMode = e.target.value;
        cameraModeSelect.disabled = true;
        let detecting = isMotionDetectionActive;
        if (detecting) stopAll();
        try {
          await openCamera(cameraMode);
          previousFrame = null;
          isPreviewActive = true;
          video.classList.remove('preview-hidden');
          statusText.textContent = 'Bereit. Bitte Erkennung starten.';
          statusText.className = 'status-box status-idle';
        } catch (err) {
          cameraMode = old;
          cameraModeSelect.value = old;
          try {
            await openCamera(old);
          } catch (e) {}
          statusText.textContent = 'Kamera-Modus konnte nicht gewechselt werden.';
          statusText.className = 'status-box status-idle';
        } finally {
          cameraModeSelect.disabled = false;
        }
      });
      startBtn.addEventListener('click', () => {
        if (!stream) return alert('Kamera nicht verfügbar. Bitte Live-Preview aktivieren.');
        startBtn.style.display = 'none';
        stopBtn.style.display = 'block';
        isMotionDetectionActive = true;
        statusText.textContent = 'Warte auf Bewegung...';
        statusText.className = 'status-box status-idle';
        startMotionDetection();
      });
      stopBtn.addEventListener('click', stopAll);
      function stopAll() {
        if (isRecording) stopVideoRecording(false);
        isMotionDetectionActive = false;
        clearInterval(checkMotionInterval);
        startBtn.style.display = 'block';
        stopBtn.style.display = 'none';
        statusText.textContent = 'Bereit. Bitte Erkennung starten.';
        statusText.className = 'status-box status-idle';
        previousFrame = null;
      }
      function startMotionDetection() {
        clearInterval(checkMotionInterval);
        checkMotionInterval = setInterval(() => {
          if (!stream || !isMotionDetectionActive) return;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          let current = ctx.getImageData(0, 0, canvas.width, canvas.height);
          if (previousFrame) {
            let changed = 0,
              total = current.data.length / 4;
            for (let i = 0; i < current.data.length; i += 4)
              if (
                Math.abs(current.data[i] - previousFrame.data[i]) +
                  Math.abs(current.data[i + 1] - previousFrame.data[i + 1]) +
                  Math.abs(current.data[i + 2] - previousFrame.data[i + 2]) >
                SENSITIVITY
              )
                changed++;
            let ratio = changed / total;
            motionValueText.textContent = `Bewegung: ${(ratio * 100).toFixed(1)}%`;
            if (ratio > MOTION_THRESHOLD) {
              lastMotionTime = Date.now();
              if (!isRecording) startVideoRecording();
            } else if (isRecording && Date.now() - lastMotionTime > COOLDOWN_TIME)
              stopVideoRecording(true);
          }
          previousFrame = current;
        }, 100);
      }
      function startVideoRecording() {
        isRecording = true;
        recordedChunks = [];
        statusText.textContent = '● AUFNAHME LÄUFT...';
        statusText.className = 'status-box status-recording';
        let o = { mimeType: 'video/webm;codecs=vp9,opus', videoBitsPerSecond: 12000000 };
        if (!MediaRecorder.isTypeSupported(o.mimeType))
          o = { mimeType: 'video/webm;codecs=vp8,opus', videoBitsPerSecond: 12000000 };
        if (!MediaRecorder.isTypeSupported(o.mimeType))
          o = { mimeType: 'video/mp4', videoBitsPerSecond: 12000000 };
        try {
          mediaRecorder = new MediaRecorder(stream, o);
        } catch (e) {
          mediaRecorder = new MediaRecorder(stream);
        }
        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size) recordedChunks.push(e.data);
        };
        mediaRecorder.onstop = () => {
          if (recordedChunks.length) triggerAutoDownload();
        };
        mediaRecorder.start();
      }
      function stopVideoRecording(save) {
        isRecording = false;
        statusText.textContent = 'Warte auf Bewegung...';
        statusText.className = 'status-box status-idle';
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          if (!save) mediaRecorder.onstop = null;
          mediaRecorder.stop();
        }
      }
      function triggerAutoDownload() {
        let blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' }),
          url = URL.createObjectURL(blob),
          a = document.createElement('a');
        clipCounter++;
        clipCountText.textContent = `Gespeicherte Clips: ${clipCounter}`;
        a.style.display = 'none';
        a.href = url;
        a.download = `Skate_Clip_${new Date().toISOString().replace(/[:.]/g, '-')}.webm`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          a.remove();
          URL.revokeObjectURL(url);
        }, 100);
      }
      window.addEventListener('beforeunload', () => {
        releaseWakeLock();
        stopCameraStream();
      });
    </script>
  </body>
</html>
