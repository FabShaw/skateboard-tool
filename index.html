
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skate Motion Capture</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #00ff88; font-size: 1.5rem; margin-bottom: 10px; }
        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 15px; }
        video { width: 100%; border-radius: 8px; background-color: #222; transform: scaleX(1); }
        .controls { display: flex; gap: 10px; }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-start { background-color: #00ff88; color: #121212; }
        .btn-start:hover { background-color: #00cc6e; }
        .btn-stop { background-color: #ff3333; color: white; }
        .btn-stop:hover { background-color: #cc0000; }
        .btn-preview { background-color: #0088ff; color: white; }
        .btn-preview:hover { background-color: #0066cc; }
        .btn-preview-active { background-color: #00ff88; color: #121212; }
        .btn-preview-active:hover { background-color: #00cc6e; }
        .status-box {
            padding: 15px;
            border-radius: 6px;
            background-color: #1e1e1e;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            border: 1px solid #333;
        }
        .status-idle { color: #aaaaaa; }
        .status-recording { color: #ff3333; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .stats { font-size: 0.85rem; color: #888; display: flex; justify-content: space-between; padding: 0 5px; }
        .settings {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .setting-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .setting-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #00ff88;
            font-weight: bold;
        }
        .setting-value {
            color: #888;
            font-size: 0.85rem;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #333;
            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #00ff88;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0, 255, 136, 0.5);
        }
        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #00ff88;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 5px rgba(0, 255, 136, 0.5);
        }
        select {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            background-color: #2a2a2a;
            color: #00ff88;
            border: 1px solid #444;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
        }
        select option {
            background-color: #1e1e1e;
            color: #00ff88;
        }
        select:hover {
            background-color: #333;
        }
        canvas { display: none; }
        .preview-hidden { display: none; }
        .wake-lock-indicator {
            font-size: 0.75rem;
            color: #00ff88;
            margin-top: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Skate Motion Capture</h1>
    
    <button class="btn-preview" id="previewToggleBtn">Live-Preview aktivieren</button>
    
    <video id="preview" autoplay playsinline muted class="preview-hidden"></video>
    <canvas id="motionCanvas"></canvas>
    
    <div class="controls">
        <button class="btn-start" id="startBtn">Erkennung Starten</button>
        <button class="btn-stop" id="stopBtn" style="display:none;">Stoppen</button>
    </div>
    
    <div class="status-box status-idle" id="statusText">Bereit. Bitte Erkennung starten.</div>
    
    <div class="stats">
        <span id="clipCount">Gespeicherte Clips: 0</span>
        <span id="motionValue">Bewegung: 0%</span>
    </div>
    
    <div class="settings">
        <div class="setting-row">
            <div class="setting-label">
                <span>Empfindlichkeit (Sensitivity)</span>
                <span class="setting-value" id="sensitivityValue">50</span>
            </div>
            <input type="range" id="sensitivitySlider" min="0" max="255" value="50">
        </div>
        
        <div class="setting-row">
            <div class="setting-label">
                <span>Bewegungsschwelle (Motion Threshold)</span>
                <span class="setting-value" id="thresholdValue">1.5%</span>
            </div>
            <input type="range" id="thresholdSlider" min="0.5" max="10" step="0.5" value="1.5">
        </div>
        
        <div class="setting-row">
            <div class="setting-label">
                <span>Nachlaufzeit (Cooldown)</span>
                <span class="setting-value" id="cooldownValue">4s</span>
            </div>
            <input type="range" id="cooldownSlider" min="1" max="10" value="4">
        </div>

        <div class="setting-row">
            <div class="setting-label">
                <span>Video FPS</span>
                <span class="setting-value" id="actualFpsValue">Kamera: -- FPS</span>
            </div>
            <select id="fpsSelect">
                <option value="24">24 FPS</option>
                <option value="30" selected>30 FPS</option>
                <option value="60">60 FPS</option>
            </select>
        </div>
    </div>
    
    <div class="wake-lock-indicator" id="wakeLockIndicator"></div>
</div>

<script>
const video = document.getElementById('preview');
const canvas = document.getElementById('motionCanvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const statusText = document.getElementById('statusText');
const clipCountText = document.getElementById('clipCount');
const motionValueText = document.getElementById('motionValue');
const previewToggleBtn = document.getElementById('previewToggleBtn');
const wakeLockIndicator = document.getElementById('wakeLockIndicator');

const sensitivitySlider = document.getElementById('sensitivitySlider');
const thresholdSlider = document.getElementById('thresholdSlider');
const cooldownSlider = document.getElementById('cooldownSlider');
const fpsSelect = document.getElementById('fpsSelect');

const sensitivityValue = document.getElementById('sensitivityValue');
const thresholdValue = document.getElementById('thresholdValue');
const cooldownValue = document.getElementById('cooldownValue');
const actualFpsValue = document.getElementById('actualFpsValue');

let SENSITIVITY = 50;
let MOTION_THRESHOLD = 0.015;
let COOLDOWN_TIME = 4000;
let VIDEO_FPS = 30;

let stream = null;
let mediaRecorder = null;
let recordedChunks = [];
let previousFrame = null;
let isRecording = false;
let isMotionDetectionActive = false;
let isPreviewActive = false;
let lastMotionTime = 0;
let checkMotionInterval = null;
let clipCounter = 0;
let wakeLock = null;

const STORAGE_KEYS = {
    sensitivity: 'skateCapture_sensitivity',
    threshold: 'skateCapture_threshold',
    cooldown: 'skateCapture_cooldown',
    fps: 'skateCapture_fps'
};

// ------------------------------------------------------------
// Wake Lock
// ------------------------------------------------------------

async function requestWakeLock() {
    if (!('wakeLock' in navigator)) {
        updateWakeLockIndicator(false);
        return;
    }

    try {
        wakeLock = await navigator.wakeLock.request('screen');
        updateWakeLockIndicator(true);
    } catch (err) {
        console.warn('Wake Lock konnte nicht aktiviert werden:', err);
        updateWakeLockIndicator(false);
    }
}

async function releaseWakeLock() {
    if (!wakeLock) return;

    try {
        await wakeLock.release();
    } catch (err) {
        console.warn('Fehler beim Freigeben des Wake Lock:', err);
    } finally {
        wakeLock = null;
        updateWakeLockIndicator(false);
    }
}

function updateWakeLockIndicator(isActive) {
    wakeLockIndicator.textContent = isActive
        ? '🔒 Display bleibt an'
        : 'Wake Lock nicht verfügbar';
}

document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && isPreviewActive && !wakeLock) {
        await requestWakeLock();
    }
});

// ------------------------------------------------------------
// Settings
// ------------------------------------------------------------

function loadSettings() {
    const savedSensitivity = localStorage.getItem(STORAGE_KEYS.sensitivity);
    const savedThreshold = localStorage.getItem(STORAGE_KEYS.threshold);
    const savedCooldown = localStorage.getItem(STORAGE_KEYS.cooldown);
    const savedFps = localStorage.getItem(STORAGE_KEYS.fps);

    if (savedSensitivity !== null) {
        sensitivitySlider.value = savedSensitivity;
        SENSITIVITY = parseInt(savedSensitivity, 10);
        sensitivityValue.textContent = SENSITIVITY;
    }

    if (savedThreshold !== null) {
        thresholdSlider.value = savedThreshold;
        MOTION_THRESHOLD = parseFloat(savedThreshold) / 100;
        thresholdValue.textContent = savedThreshold + '%';
    }

    if (savedCooldown !== null) {
        cooldownSlider.value = savedCooldown;
        COOLDOWN_TIME = parseInt(savedCooldown, 10) * 1000;
        cooldownValue.textContent = savedCooldown + 's';
    }

    if (savedFps !== null) {
        fpsSelect.value = savedFps;
        VIDEO_FPS = parseInt(savedFps, 10);
    }
}

function saveSettings() {
    localStorage.setItem(STORAGE_KEYS.sensitivity, sensitivitySlider.value);
    localStorage.setItem(STORAGE_KEYS.threshold, thresholdSlider.value);
    localStorage.setItem(STORAGE_KEYS.cooldown, cooldownSlider.value);
    localStorage.setItem(STORAGE_KEYS.fps, fpsSelect.value);
}

// ------------------------------------------------------------
// Camera / FPS
// ------------------------------------------------------------

function getVideoTrack() {
    return stream?.getVideoTracks?.()[0] ?? null;
}

function getActualFPS() {
    const track = getVideoTrack();
    if (!track) return null;

    const fps = track.getSettings().frameRate;
    return Number.isFinite(fps) ? fps : null;
}

function updateActualFPSDisplay() {
    const actualFPS = getActualFPS();

    if (actualFPS !== null) {
        actualFpsValue.textContent = `Kamera: ${actualFPS} FPS`;
        fpsSelect.title = `Gewählt: ${VIDEO_FPS} FPS | Kamera: ${actualFPS} FPS`;
    } else {
        actualFpsValue.textContent = 'Kamera: -- FPS';
        fpsSelect.title = `Gewählt: ${VIDEO_FPS} FPS`;
    }
}

async function applyVideoFPS() {
    const track = getVideoTrack();
    if (!track) return null;

    try {
        await track.applyConstraints({
            frameRate: {
                ideal: VIDEO_FPS
            }
        });

        const actualFPS = getActualFPS();

        console.log(
            `Requested FPS: ${VIDEO_FPS}, actual camera FPS: ${actualFPS ?? 'unknown'}`
        );

        updateActualFPSDisplay();
        return actualFPS;
    } catch (err) {
        console.warn(
            `Die gewünschte Framerate von ${VIDEO_FPS} FPS konnte nicht angewendet werden:`,
            err
        );

        updateActualFPSDisplay();
        return getActualFPS();
    }
}

async function createCameraStream() {
    if (!navigator.mediaDevices?.getUserMedia) {
        throw new Error('Dieser Browser unterstützt keinen Kamerazugriff.');
    }

    stream = await navigator.mediaDevices.getUserMedia({
        video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 },
            frameRate: { ideal: VIDEO_FPS }
        },
        audio: true
    });

    const track = getVideoTrack();

    if (track) {
        console.log('Camera capabilities:', track.getCapabilities?.());
        console.log('Camera settings after getUserMedia():', track.getSettings());
    }

    await applyVideoFPS();

    video.srcObject = stream;

    await new Promise(resolve => {
        if (video.readyState >= 1) {
            resolve();
        } else {
            video.onloadedmetadata = () => resolve();
        }
    });

    canvas.width = 160;
    canvas.height = 120;

    updateActualFPSDisplay();
}

function stopCameraStream() {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }

    video.srcObject = null;
    updateActualFPSDisplay();
}

// ------------------------------------------------------------
// Preview
// ------------------------------------------------------------

previewToggleBtn.addEventListener('click', async () => {
    if (isPreviewActive) {
        deactivatePreview();
    } else {
        await activatePreview();
    }
});

async function activatePreview() {
    try {
        if (!stream) {
            await createCameraStream();
        } else {
            await applyVideoFPS();
        }

        isPreviewActive = true;
        video.classList.remove('preview-hidden');
        previewToggleBtn.textContent = 'Live-Preview deaktivieren';
        previewToggleBtn.classList.add('btn-preview-active');

        statusText.textContent = 'Bereit. Bitte Erkennung starten.';
        statusText.className = 'status-box status-idle';

        await requestWakeLock();
    } catch (err) {
        console.error('Kamera konnte nicht gestartet werden:', err);

        stopCameraStream();
        isPreviewActive = false;

        alert('Fehler beim Zugriff auf Kamera/Mikrofon: ' + err.message);

        statusText.textContent = 'Kamera konnte nicht gestartet werden.';
        statusText.className = 'status-box status-idle';
    }
}

function deactivatePreview() {
    isPreviewActive = false;

    if (isMotionDetectionActive) {
        stopAll();
    }

    stopCameraStream();

    video.classList.add('preview-hidden');
    previewToggleBtn.textContent = 'Live-Preview aktivieren';
    previewToggleBtn.classList.remove('btn-preview-active');

    statusText.textContent = 'Bereit. Bitte Erkennung starten.';
    statusText.className = 'status-box status-idle';

    releaseWakeLock();
}

// ------------------------------------------------------------
// FPS selection
// ------------------------------------------------------------

fpsSelect.addEventListener('change', async (e) => {
    const requestedFPS = parseInt(e.target.value, 10);
    if (!Number.isFinite(requestedFPS)) return;

    VIDEO_FPS = requestedFPS;
    saveSettings();

    if (!stream) {
        actualFpsValue.textContent = 'Kamera: -- FPS';
        return;
    }

    const actualFPS = await applyVideoFPS();

    console.log(
        `FPS selection changed: requested=${VIDEO_FPS}, actual=${actualFPS ?? 'unknown'}`
    );
});

// ------------------------------------------------------------
// Other settings
// ------------------------------------------------------------

sensitivitySlider.addEventListener('input', (e) => {
    SENSITIVITY = parseInt(e.target.value, 10);
    sensitivityValue.textContent = SENSITIVITY;
    saveSettings();
});

thresholdSlider.addEventListener('input', (e) => {
    MOTION_THRESHOLD = parseFloat(e.target.value) / 100;
    thresholdValue.textContent = e.target.value + '%';
    saveSettings();
});

cooldownSlider.addEventListener('input', (e) => {
    COOLDOWN_TIME = parseInt(e.target.value, 10) * 1000;
    cooldownValue.textContent = e.target.value + 's';
    saveSettings();
});

// ------------------------------------------------------------
// Motion detection
// ------------------------------------------------------------

startBtn.addEventListener('click', () => {
    if (!stream) {
        alert('Kamera nicht verfügbar. Bitte Live-Preview aktivieren.');
        return;
    }

    startBtn.style.display = 'none';
    stopBtn.style.display = 'block';

    isMotionDetectionActive = true;
    previousFrame = null;

    statusText.textContent = 'Warte auf Bewegung...';
    statusText.className = 'status-box status-idle';

    startMotionDetection();
});

stopBtn.addEventListener('click', () => {
    stopAll();
});

function stopAll() {
    if (isRecording) {
        stopVideoRecording(false);
    }

    isMotionDetectionActive = false;

    if (checkMotionInterval !== null) {
        clearInterval(checkMotionInterval);
        checkMotionInterval = null;
    }

    startBtn.style.display = 'block';
    stopBtn.style.display = 'none';

    statusText.textContent = 'Bereit. Bitte Erkennung starten.';
    statusText.className = 'status-box status-idle';

    previousFrame = null;
}

function startMotionDetection() {
    if (checkMotionInterval !== null) {
        clearInterval(checkMotionInterval);
    }

    checkMotionInterval = setInterval(() => {
        if (!stream || !isMotionDetectionActive || video.readyState < 2) {
            return;
        }

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const currentFrame = ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );

        if (previousFrame) {
            let changedPixels = 0;
            const totalPixels = currentFrame.data.length / 4;

            for (let i = 0; i < currentFrame.data.length; i += 4) {
                const rDiff = Math.abs(
                    currentFrame.data[i] - previousFrame.data[i]
                );
                const gDiff = Math.abs(
                    currentFrame.data[i + 1] - previousFrame.data[i + 1]
                );
                const bDiff = Math.abs(
                    currentFrame.data[i + 2] - previousFrame.data[i + 2]
                );

                if (rDiff + gDiff + bDiff > SENSITIVITY) {
                    changedPixels++;
                }
            }

            const motionRatio = changedPixels / totalPixels;

            motionValueText.textContent =
                `Bewegung: ${(motionRatio * 100).toFixed(1)}%`;

            if (motionRatio > MOTION_THRESHOLD) {
                lastMotionTime = Date.now();

                if (!isRecording) {
                    startVideoRecording();
                }
            } else if (
                isRecording &&
                Date.now() - lastMotionTime > COOLDOWN_TIME
            ) {
                stopVideoRecording(true);
            }
        }

        previousFrame = currentFrame;
    }, 100);
}

// ------------------------------------------------------------
// Recording
// ------------------------------------------------------------

function getSupportedVideoMimeType() {
    const mimeTypes = [
        'video/webm;codecs=vp9,opus',
        'video/webm;codecs=vp8,opus',
        'video/webm',
        'video/mp4'
    ];

    return mimeTypes.find(type => MediaRecorder.isTypeSupported(type)) || '';
}

function startVideoRecording() {
    if (!stream || isRecording) return;

    const mimeType = getSupportedVideoMimeType();

    // The FPS is controlled by the MediaStreamTrack. The bitrate is independent.
    const options = mimeType
        ? {
            mimeType,
            videoBitsPerSecond: 12_000_000
        }
        : {
            videoBitsPerSecond: 12_000_000
        };

    try {
        mediaRecorder = new MediaRecorder(stream, options);
    } catch (e) {
        console.warn('MediaRecorder mit Optionen fehlgeschlagen:', e);
        mediaRecorder = new MediaRecorder(stream);
    }

    recordedChunks = [];
    isRecording = true;

    const actualFPS = getActualFPS();

    console.log(
        `Recording started. Requested FPS: ${VIDEO_FPS}, actual camera FPS: ${actualFPS ?? 'unknown'}, mimeType: ${mediaRecorder.mimeType}`
    );

    statusText.textContent =
        `● AUFNAHME LÄUFT... (${actualFPS ? actualFPS + ' FPS' : 'FPS unbekannt'})`;
    statusText.className = 'status-box status-recording';

    mediaRecorder.ondataavailable = (event) => {
        if (event.data && event.data.size > 0) {
            recordedChunks.push(event.data);
        }
    };

    mediaRecorder.onerror = (event) => {
        console.error('MediaRecorder error:', event.error);
        isRecording = false;
    };

    mediaRecorder.onstop = () => {
        if (recordedChunks.length > 0) {
            triggerAutoDownload();
        }
    };

    mediaRecorder.start();
}

function stopVideoRecording(shouldSave) {
    isRecording = false;

    if (isMotionDetectionActive) {
        statusText.textContent = 'Warte auf Bewegung...';
        statusText.className = 'status-box status-idle';
    }

    if (!mediaRecorder || mediaRecorder.state === 'inactive') {
        return;
    }

    if (!shouldSave) {
        mediaRecorder.onstop = null;
    }

    mediaRecorder.stop();
}

function triggerAutoDownload() {
    if (!mediaRecorder || recordedChunks.length === 0) {
        return;
    }

    const mimeType = mediaRecorder.mimeType || 'video/webm';
    const blob = new Blob(recordedChunks, { type: mimeType });
    const url = URL.createObjectURL(blob);

    const now = new Date();
    const timeStr = now.toISOString().replace(/[:.]/g, '-');

    clipCounter++;
    clipCountText.textContent = `Gespeicherte Clips: ${clipCounter}`;

    const extension = mimeType.includes('mp4') ? 'mp4' : 'webm';

    const a = document.createElement('a');
    a.style.display = 'none';
    a.href = url;
    a.download = `Skate_Clip_${timeStr}.${extension}`;

    document.body.appendChild(a);
    a.click();

    setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }, 100);
}

// ------------------------------------------------------------
// Initialization / cleanup
// ------------------------------------------------------------

window.addEventListener('DOMContentLoaded', () => {
    loadSettings();
    updateActualFPSDisplay();
});

window.addEventListener('beforeunload', () => {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
    }

    if (wakeLock) {
        releaseWakeLock();
    }
});
</script>

</body>
</html>
